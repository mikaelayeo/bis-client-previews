<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<title>Field Management · Onboarding preview</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--ink:#19191a;--mut:#5f6168;--line:#d5d6db;--blue:#0078b3;--link:#1a73c8;--blue-l:#e5f2f9;--purple:#433a5c;--green:#4cb944;--green-l:#e8f5e6;--teal:#1597c4;--teal-l:#e2f1f7;--violet:#5b6fb0;--violet-l:#e7eaf4;--amber:#c47a00;--amber-l:#fdf3e1;--red:#c62828;--grey-l:#f0f0f2;--r:6px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}
button{font:inherit;cursor:pointer}
a{cursor:pointer}
.proto{background:#19191a;color:#fff;padding:6px 16px;font-size:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.proto .sp{flex:1}.proto a{color:#9cd3f0}
.proto select{font:inherit;font-size:12px;background:#333;color:#fff;border:1px solid #555;border-radius:3px}
.top{background:#fff;display:flex;align-items:center;padding:10px 16px;gap:12px;border-bottom:1px solid #eee}
.bis{font-weight:800;font-size:22px;color:#2b2b3a;letter-spacing:-1px}.bis small{font-weight:400;font-size:10px;letter-spacing:0;display:inline-block;line-height:1.1;border-left:1px solid #999;padding-left:6px;margin-left:6px;vertical-align:middle}
.top .sp{flex:1}.search{border:1px solid var(--line);border-radius:3px;padding:5px 10px;width:200px;color:#999;font-size:13px}
nav.main{display:flex;gap:26px;padding:0 16px;overflow-x:auto;white-space:nowrap;background:#fff;border-bottom:1px solid #e3e3e3}
nav.main a{padding:10px 0;color:var(--ink);border-bottom:2px solid transparent;font-size:15px}
nav.main a.on{border-color:var(--purple);font-weight:600}
.new{background:var(--blue);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 6px;margin-left:5px;vertical-align:2px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
main{max-width:1100px;margin:0 auto;padding:18px 16px 90px}
main.wide{max-width:none;padding:0 0 90px}
main.fm{max-width:none;padding:0;display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 120px)}
@media(max-width:760px){main.fm{grid-template-columns:1fr}.side{display:none}}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:20px}
h1{font-size:20px;margin:0 0 4px;font-weight:600}h2{font-size:17px;margin:0 0 4px;font-weight:600}h3{font-size:14px;margin:0 0 6px;font-weight:600}
.mut{color:var(--mut)}.sm{font-size:12px}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:4px;padding:7px 14px}
.btn.sec{background:#fff;color:var(--blue)}.btn.ghost{border-color:transparent;background:none;color:var(--blue);padding:7px 8px}
.btn.g{background:#5cb85c;border-color:#5cb85c;padding:4px 14px}.btn.b{background:#1aa1d6;border-color:#1aa1d6;padding:4px 14px}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
/* home */
.tools{display:flex;justify-content:flex-end;gap:6px;padding:8px 10px;background:#fff;flex-wrap:wrap}
.seg2{display:flex;border:1px solid #999}.seg2 span{padding:3px 30px;border-left:1px solid #999;font-size:13px}.seg2 span:first-child{border:0;background:var(--purple);color:#fff}
.pbar{background:var(--purple);color:#fff;padding:11px 10px;font-size:15px;display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse;background:#fff}th{background:#e9e9ec;text-align:left;padding:10px 8px;font-weight:600;font-size:13px}td{padding:9px 8px;border-bottom:1px solid #eee;font-size:13px}
td a{color:var(--link)}
.banner{display:flex;gap:14px;align-items:center;background:var(--blue-l);border:1px solid #b9dcee;border-left:4px solid var(--blue);padding:12px 14px;margin:10px;flex-wrap:wrap}
.ico i,.srcic i{font-size:inherit}
.ico{width:40px;height:40px;border-radius:8px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-size:20px;flex:none}
.banner .ico i,.srcic i{font-size:inherit}
.ico{background:#fff}
.anchored{position:absolute;z-index:8;width:270px;background:#19191a;color:#fff;border-radius:6px;padding:12px;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.anchored:before{content:"";position:absolute;top:-6px;left:24px;border:6px solid transparent;border-top:0;border-bottom-color:#19191a}
.anchored button,.tip button{font-size:12px;border-radius:3px;padding:3px 9px;border:1px solid #fff;background:#fff;color:#19191a}.anchored button.x,.tip button.x{background:none;color:#ccc;border-color:#555}
/* steps */
.steps{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.step{border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 12px 3px 4px;color:var(--mut);display:flex;gap:6px;align-items:center;font-size:13px}
.step i{font-style:normal;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px}
.step.on{border-color:var(--teal);color:var(--ink)}.step.on i{border-color:var(--teal);color:var(--teal)}
.step.done i{background:var(--teal);border-color:var(--teal);color:#fff}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;z-index:3}
.foot .in{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center}
.saved{font-size:12px;color:var(--mut)}.saved:before{content:"✓ ";color:var(--green)}
.pic{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin:16px 0}
.lvl{flex:1;min-width:130px;border-radius:var(--r);padding:12px;border:1px solid}
.lvl b{display:block}.arrow{align-self:center;color:var(--mut)}
.t-group{background:var(--green-l);border-color:var(--green)}.t-site{background:var(--teal-l);border-color:var(--teal)}
.t-job{background:var(--violet-l);border-color:var(--violet)}.t-crew{background:var(--amber-l);border-color:var(--amber)}.t-asset{background:#f3eee6;border-color:#a1887f}.t-none{background:var(--grey-l);border-color:var(--line)}
.map{display:grid;grid-template-columns:auto auto 1fr;gap:6px 10px;align-items:center;margin-top:10px}
.ai{background:var(--blue-l);border:1px solid #b9dcee;border-radius:var(--r);padding:14px}
.shape{border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:#fff}
.shape.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.box2{width:18px;height:18px;border:1.5px solid #999;border-radius:3px;flex:none;margin-top:2px;display:grid;place-items:center;font-size:12px;color:#fff}
.on>.box2,.box2.on{background:var(--blue);border-color:var(--blue)}
.shapes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}@media(max-width:700px){.shapes{grid-template-columns:1fr}}
.because{font-size:12px;color:var(--teal);margin-top:4px}
/* AI drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);z-index:20;display:flex;flex-direction:column}
.drawer .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .bd{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fafafb}
.drawer .ft{padding:12px 16px;border-top:1px solid var(--line)}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;font-size:13px}
.msg.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.quick{display:flex;flex-wrap:wrap;gap:6px}.quick button{border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:14px;padding:4px 10px;font-size:12px}
.proposal{border:1px solid var(--blue);border-radius:8px;background:#fff;padding:12px}
/* tree */
.tree{font-size:13px}
.node{display:flex;align-items:center;gap:8px;margin:5px 0}
.box{flex:1;display:flex;align-items:center;gap:8px;border:1px solid;border-radius:3px;padding:6px 8px;min-height:34px}
.cnt{font-size:11px;background:#fff;border-radius:9px;padding:0 7px;border:1px solid var(--line)}
.sel{border:1px solid var(--line);border-radius:4px;padding:4px 6px;font:inherit;font-size:12px;background:#fff}
.sug{font-size:11px;color:var(--blue)}
.indent{border-left:1px dashed #aab;margin-left:14px;padding-left:14px}
.chip{font-size:11px;border-radius:10px;padding:1px 8px;border:1px solid;white-space:nowrap}
.preview .pn{padding:3px 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--mut)}
.tabs button.on{border-color:var(--blue);color:var(--ink);font-weight:600}
.sync{display:flex;gap:10px;align-items:flex-start;background:var(--green-l);border:1px solid #bfe3bb;border-radius:var(--r);padding:10px;margin-top:12px}
.tip{background:#19191a;color:#fff;border-radius:6px;padding:10px 12px;font-size:12px;margin:8px 0 10px;position:relative}
.tip:before{content:"";position:absolute;top:-6px;left:22px;border:6px solid transparent;border-top:0;border-bottom-color:#19191a}
/* build places (drag) */
.brow{display:flex;align-items:center;gap:6px;margin:4px 0;position:relative}
.brow .box{cursor:grab;background:#fff}
.brow.drag{opacity:.4}
.handle{color:#999;cursor:grab;user-select:none;padding:0 2px}
.dropline{position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--blue);border-radius:2px}
.dropline.child{left:34px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:3px;width:26px;height:26px;padding:0;color:var(--mut)}
.box input{border:0;background:transparent;font:inherit;flex:1;min-width:60px}
/* words */
.wordrow{border-top:1px solid var(--line);padding:12px 0}.wordrow:first-of-type{border-top:0}
.ideas{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.idea{border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 11px;font-size:12px}
.idea.on{background:var(--blue);border-color:var(--blue);color:#fff}
/* routine */
.rcard{border:1px solid var(--line);border-radius:var(--r);margin:8px 0;background:#fff}
.rcard.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.rcard .rh{padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.rcard .items{border-top:1px solid var(--line);padding:6px 12px 10px 40px}
.item{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.tag{font-size:10px;border-radius:3px;padding:0 5px;border:1px solid var(--line);color:var(--mut)}
.attach{display:flex;flex-wrap:wrap;gap:6px}
.attach label{border:1px solid var(--line);border-radius:14px;padding:3px 10px 3px 6px;font-size:12px;display:flex;gap:5px;align-items:center;cursor:pointer;background:#fff}
.attach label.on{border-color:var(--blue);background:var(--blue-l)}
/* phone */
.phone{width:270px;margin:0 auto;border:10px solid #1d1d20;border-radius:34px;background:#fff;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.phone .notch{height:22px;background:#1d1d20;display:flex;justify-content:center}.phone .notch i{width:80px;height:14px;background:#000;border-radius:0 0 10px 10px}
.phone .ph{background:var(--purple);color:#fff;padding:10px 12px}
.phone .pb{padding:10px 12px;min-height:330px;font-size:13px}
.prow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #eee;cursor:pointer}
/* checklist/launcher */
.check{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;flex:none}
.tick.y{background:var(--green);border-color:var(--green);color:#fff}
.bar{height:6px;background:var(--grey-l);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.bar.g i{background:var(--green)}
.empty{text-align:center;padding:28px 16px;border:1px dashed var(--line);border-radius:var(--r);background:#fff}
.launcher{position:fixed;right:16px;bottom:16px;z-index:7}
.launcher .pill{background:var(--purple);color:#fff;border-radius:22px;padding:9px 16px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;border:0}
.launcher .panel{width:330px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:14px;margin-bottom:8px}
.ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(#7fd17a calc(var(--p)*1%),rgba(255,255,255,.25) 0);display:grid;place-items:center}
.ring:after{content:"";width:14px;height:14px;border-radius:50%;background:var(--purple)}
/* FM pages */
.side{background:#fff;border-right:1px solid var(--line);padding:14px 10px;font-size:13px}
.side a{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:16px;color:var(--ink)}
.side a.on{background:var(--blue-l);outline:1px solid var(--teal);font-weight:600}
.side .sub{padding-left:28px;font-size:12px}
.side .lab{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:14px 10px 4px}
.fmbody{padding:18px 20px 90px;max-width:1080px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.cards{grid-template-columns:1fr}}
.lr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px;border-top:1px solid #f0f0f0}
.mini{width:60px;height:5px;background:var(--grey-l);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px}.mini i{display:block;height:100%;background:var(--blue)}
.daybar{display:inline-flex;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:13px}.daybar span{padding:4px 10px;border-left:1px solid var(--line)}.daybar span:first-child{border:0}
.hint{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:var(--r);padding:10px 12px;margin-bottom:14px;font-size:13px}
.note{position:fixed;right:16px;top:40px;width:320px;box-shadow:0 8px 24px rgba(0,0,0,.18);background:#fffbe6;border:1px solid #e8d77a;border-radius:6px;padding:10px 12px;font-size:12px;z-index:6}
.note b{display:block;margin-bottom:2px}
.hide{display:none}
/* ===== Match the FM prototype (v3.3): tokens and components ===== */
:root{--blue:#0078B3;--link:#0078B3;--line:#DFDFE2;--mut:#636368;--ink:#19191A;--green:#167B00;--red:#CC2222;--amber:#9C6300;--blue-l:#F0F9FE}
main{max-width:1320px;margin:0 auto;padding:16px 24px 90px}
.foot .in{max-width:1272px}
.card{border:1px solid #DFDFE2;border-radius:8px;padding:16px;background:#FEFEFE}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:4px 10px;border-radius:4px;border:1px solid transparent;background:#0078B3;color:#FEFEFE;font-size:15px;font-weight:600;white-space:nowrap}
.btn:hover{background:#095F8C}
.btn.sec{background:transparent;border-color:#AFAFB5;color:#636368}.btn.sec:hover{background:#F2F2F2}
.btn.ghost{background:transparent;border-color:transparent;color:#0078B3;font-weight:400;padding:4px 4px}.btn.ghost:hover{text-decoration:underline;background:transparent}
.btn.sm{height:26px;padding:4px 8px;font-size:13px}
.btn:disabled{background:#F2F2F2;color:#AFAFB5;border-color:transparent;opacity:1}
.chip{border-radius:4px;font-size:12px;font-weight:600;padding:2px 6px}
.fseg{display:inline-flex;border:1px solid #AFAFB5;border-radius:4px;overflow:hidden;background:#FEFEFE;height:30px;flex:none}
.fseg button{border:0;background:none;padding:2px 12px;font-size:14px;color:#19191A}
.fseg button+button{border-left:1px solid #AFAFB5}
.fseg button[aria-pressed="true"]{background:#F8FEFF;color:#0078B3;font-weight:600;box-shadow:inset 0 -2px 0 #0078B3}
.fseg.sm{height:24px}.fseg.sm button{font-size:12px;padding:1px 8px}
.tabs button.on{border-color:#0078B3;color:#0078B3}
.rowlist{border:1px solid #DFDFE2;border-radius:8px;overflow:hidden;background:#FEFEFE}
.rowlist>div{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid #DFDFE2}
.rowlist>div:first-child{border-top:0}
.srcic{width:34px;height:34px;border-radius:8px;background:#F2F2F2;display:grid;place-items:center;font-size:17px;flex:none}
.find{background:#FEFEFE;border:1px solid #DFDFE2;border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.find.yes{border-color:#167B00;background:#F6FCEC}.find.no{border-color:#CC2222;background:#FFF6F6}
.yn{display:flex;gap:4px;margin-left:auto;flex:none}
.yn button{width:28px;height:28px;border-radius:50%;border:1px solid #AFAFB5;background:#FEFEFE;color:#636368;font-size:13px;padding:0}
.yn button.y[aria-pressed="true"]{background:#167B00;border-color:#167B00;color:#fff}
.yn button.n[aria-pressed="true"]{background:#CC2222;border-color:#CC2222;color:#fff}
.ftree .box{background:#FEFEFE}
.ftree .box.t-group{background:#EBF8D6;border-color:#4cb944}.ftree .box.t-site{background:#e2f1f7;border-color:#1597c4}.ftree .box.t-job{background:#e7eaf4;border-color:#5b6fb0}.ftree .box.t-crew{background:#fdf3e1;border-color:#c47a00}.ftree .box.t-asset{background:#f3eee6;border-color:#a1887f}
.phone.small{transform:scale(.82);transform-origin:top center;margin-bottom:-70px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pill{border:1px solid #AFAFB5;background:#FEFEFE;border-radius:80px;padding:6px 14px;font-size:14px;color:#19191A}
.pill:hover{background:#F2F2F2}.pill.on{border-color:#009ACB;background:#F0F9FE;color:#0078B3;font-weight:600}
.chip-rec{background:#F0F9FE;border-color:#C9EFFA;color:#0078B3}
.phone.small{width:250px}
.pnode.drag{opacity:.4}
.selbox{margin:0;opacity:.35}.node:hover .selbox,.selbox:checked{opacity:1}
</style>
</head>
<body>
<div class="proto"><b>Field Management · onboarding preview</b>

<select id="variant" style="display:none"><option value="tree">tree</option></select>

<div class="top"><span class="bis">BIS<small>QAQC TEST<br>ENVIRONMENT</small></span><span class="sp"></span><span id="who"></span><span class="search">Search User</span><span class="mut">?</span><span class="mut">Log Out ›</span></div>

 crew:{type:'A',typeName:'Crew on the move',label:'Prairie Paving',line:'Paving and roadwork. Crews start at the yard and move to a new job most weeks.',

  <div class="row" style="margin-top:10px"><button class="btn sec" onclick="addTop()">+ Add at the top level</button><button class="btn ghost">Import from a file</button></div>`:
 `<div class="empty"><h3>No places yet</h3><p class="mut sm">Start with where work happens. You can group them later.</p><div class="row" style="justify-content:center"><button class="btn">Import from a file (fastest)</button><button class="btn sec" onclick="addTop()">Add one</button></div></div>`}`;

/* SM-01 rules: a group sits on top; a site sits under a group or at the top (never in a site or a job);
   a job sits at a site, under a group or at the top (never in a job); a team is the lowest level. */
const ALLOWED={asset:[null,'site','job'],group:[null],site:[null,'group'],job:[null,'group','site'],crew:[null,'group','site','job']};
const canSit=(t,p)=>t==='none'||ALLOWED[t].includes(p||null);
function whyNot(t,p){ return 'A '+sg(t).toLowerCase()+' can\'t go inside a '+sg(p).toLowerCase()+'.'+(t==='crew'?'':t==='group'?' Groups always sit at the top.':t==='site'?' '+pl('site')+' only sit under a '+sg('group').toLowerCase()+' or at the top.':' '+pl('job')+' sit at a '+sg('site').toLowerCase()+' or at the top.'); }
function bParent(i,B){ B=B||S.build; for(let k=i-1;k>=0;k--) if(B[k].d<B[i].d) return B[k].t; return null; }
function buildOk(B){ for(let i=0;i<B.length;i++){ if(i>0&&B[i].d>B[i-1].d+1) return 'skip'; if(!canSit(B[i].t,bParent(i,B))) return whyNot(B[i].t,bParent(i,B)); } return ''; }
let FT; function setFlash(i,msg){ clearTimeout(FT); S.flashI=i; S.flash=msg; render(); FT=setTimeout(()=>{ S.flash=''; S.flashI=null; render(); },3000); }
const shortErr=e=>e==='skip'?'That would skip a level.':e.split('.')[0]+'.';
function tryBuild(next,i){ const err=buildOk(next); if(err){ setFlash(i,shortErr(err)); return false; } S.build=next; S.flash=''; return true; }
const childType=t=>t==='group'?'site':t==='site'?(jobsOn()?'job':'crew'):'crew';
function block(i){ const d=S.build[i].d; let j=i+1; while(j<S.build.length&&S.build[j].d>d) j++; return [i,j]; }
function shift(i,dir){ if(dir>0&&(i===0||S.build[i].d>S.build[i-1].d)) return; const [a,b]=block(i); const N=S.build.map(x=>({...x})); for(let k=a;k<b;k++) N[k].d=Math.max(0,N[k].d+dir); if(tryBuild(N,i)) render(); }
function addUnder(i){ if(S.build[i].t==='crew'){ setFlash(i,'A '+sg('crew').toLowerCase()+' is the lowest level.'); return; } const [a,b]=block(i); S.build.forEach(x=>x.just=false); S.build.splice(b,0,{n:'',t:childType(S.build[i].t),d:S.build[i].d+1,just:true}); S.flash=''; render(); }
function addTop(){ S.build.forEach(x=>x.just=false); S.build.push({n:'',t:S.build.some(x=>x.t==='group')?'group':'site',d:0,just:true}); render(); }
function dStart(i){ S.dragI=i; }
function dEnd(){ S.dragI=null; S.drop=null; render(); }
function dOver(e,i){ e.preventDefault(); if(S.dragI===null||i===S.dragI) return; const r=e.currentTarget.getBoundingClientRect();
 const child=(e.clientX-r.left)>60; if(!S.drop||S.drop.i!==i||S.drop.child!==child){ S.drop={i,child}; render(); } }
function dDrop(e){ e.preventDefault(); if(S.dragI===null||!S.drop) return; const keep=S.build.map(x=>({...x}));
 const [a,b]=block(S.dragI); const moved=S.build.splice(a,b-a); const tgtIdx=S.drop.i>S.dragI?S.drop.i-(b-a):S.drop.i;
 if(tgtIdx<0||tgtIdx>=S.build.length){ S.build.splice(a,0,...moved); dEnd(); return; }
 const tgt=S.build[tgtIdx]; const nd=S.drop.child?tgt.d+1:tgt.d; const off=nd-moved[0].d; moved.forEach(m=>m.d+=off);
 const [ta,tb]=block(tgtIdx); S.build.splice(S.drop.child?tgtIdx+1:tb,0,...moved);
 const err=buildOk(S.build); const di=S.dragI; if(err){ S.build=keep; dEnd(); setFlash(di,shortErr(err)); } else { S.flash=''; dEnd(); } }

 return `<div class="side"><a class="${p==='overview'?'on':''}" onclick="fm('overview')"><i class="fa-solid fa-chart-simple"></i> Overview</a>
 <a class="sub ${p==='list'&&S.fmSite==='site'?'on':''}" onclick="fm('list','site')">${pl('site')}</a>${jobsOn()?`<a class="sub" onclick="fm('list','job')">${pl('job')}</a>`:''}<a class="sub ${p==='list'&&S.fmSite==='crew'?'on':''}" onclick="fm('list','crew')">${pl('crew')}</a><a class="sub">People</a>
 <div class="lab">Manage</div><a class="${p==='manage'?'on':''}" onclick="fm('manage')"><i class="fa-solid fa-gear"></i> Setup and words</a><a class="${p==='routines'?'on':''}" onclick="fm('routines')"><i class="fa-solid fa-list-check"></i> Routines</a>
 <div class="lab">Help</div><a onclick="go('intro')">? How it fits</a></div>`; }
function hint(k,html){ return S.hints[k]?`<div class="hint"><span><i class="fa-solid fa-lightbulb"></i></span><div style="flex:1">${html}</div><a class="sm mut" onclick="S.hints['${k}']=false;render()">✕</a></div>`:''; }
function wk(){ return S.day==='7'; }
function stat(i){ const done=[17,9,12,6,14,8,11][i%7], exp=[18,12,12,8,16,8,14][i%7]; return {done,exp}; }
function overview(){
 const sites=nodesOf('site'), crews=nodesOf('crew'), R=ROUTINES(S.client).filter(r=>S.routines.includes(r.id));
 const card=(t,list)=>{ if(!list.length) return '';
  if(!wk()) return `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${pl(t)}</h3><span class="sm mut">${list.length}</span></div>
   ${R.length?`<div class="sm mut" style="margin:6px 0 8px">Starts tomorrow: ${R.map(r=>r.name).join(', ')}</div>`:''}
   ${list.slice(0,4).map(n=>`<div class="lr"><a style="color:var(--link)" onclick="fm('place','${n.id}')">${n.name}</a><span class="sm mut">${R.length?'Nothing due yet':'No routine yet'}</span></div>`).join('')}</div>`;
  const tot=list.reduce((a,n,i)=>a+stat(i).exp,0), dn=list.reduce((a,n,i)=>a+stat(i).done,0), out=list.filter((n,i)=>stat(i).done<stat(i).exp);
  return `<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">${pl(t)}</h3><span class="mut">›</span></div>
  <div style="margin:6px 0"><b style="font-size:18px">${out.length}</b> <span style="color:var(--link)">outstanding</span> <span class="sm mut">· ${dn}/${tot} done</span></div><div class="bar"><i style="width:${dn/tot*100}%"></i></div>
  ${list.slice(0,4).map((n,i)=>`<div class="lr"><a style="color:var(--link)" onclick="fm('place','${n.id}')">${n.name}</a><span class="sm mut">${stat(i).exp-stat(i).done}/${stat(i).exp} left<span class="mini"><i style="width:${stat(i).done/stat(i).exp*100}%"></i></span></span></div>`).join('')}</div>`; };
 return `<div class="card row" style="padding:14px 20px;margin-bottom:14px"><div class="ico"><i class="fa-solid fa-chart-simple"></i></div><div style="flex:1"><h1 style="margin:0">Overview</h1><div class="sm mut">Field Management · ${countLine()}${S.source!=='fresh'?' · synced with Locations':''}</div></div><div class="daybar"><span>‹</span><span>● Today</span><span>›</span></div></div>
 ${C.peopleOnly?`<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Allowed on site today</h3><span class="sm mut">From your Training Matrix</span></div><div style="margin:6px 0"><b style="font-size:18px">412</b> <span class="sm mut">of 440 allowed in</span> · <span style="color:var(--red)">28 blocked</span> <span class="sm mut">(expired tickets)</span></div><div class="bar"><i style="width:94%"></i></div>${nodesOf('crew').slice(0,3).map((n,i)=>`<div class="lr"><span>${n.name}</span><span class="sm ${i===1?'':'mut'}" style="${i===1?'color:var(--red)':''}">${[3,17,8][i]} blocked</span></div>`).join('')}</div>`:''}
 ${!wk()?hint('overview',`<b>You're set up.</b> Tomorrow morning this page fills in as your ${pl('crew').toLowerCase()} complete their routines. You'll see what's done and what's missing at each ${sg('site').toLowerCase()}.`):''}
 ${!R.length?`<div class="empty" style="margin-bottom:14px"><div class="ico" style="margin:0 auto 8px"><i class="fa-solid fa-list-check"></i></div><h3>No routines yet</h3><p class="mut sm">Routines set what's expected each day at your ${pl('site').toLowerCase()}. Once you add one, you'll see here what's done and what's missing.</p><button class="btn" onclick="go('routine')">Add your first routine</button></div>`:''}
 <div class="cards">${card('site',sites)}${card('crew',crews)}
 ${jobsOn()?`<div class="card"><h3>${pl('job')}</h3>${wk()?`<div class="lr"><a style="color:var(--link)">${has('dispatch')?'#4471 · 12 Elm St':'Oakridge #4482'}</a><span class="sm mut">1/3 left</span></div><div class="lr"><a style="color:var(--link)">${has('dispatch')?'#4472 · 88 Bow Rd':'Riverbend #4471'}</a><span class="sm mut">Done</span></div>`:`<div class="empty" style="padding:16px"><p class="sm mut" style="margin:0 0 8px">${has('dispatch')?`${pl('job')} show up here when your ${pl('crew').toLowerCase()} start one on their phone.`:`No ${pl('job').toLowerCase()} yet.`}</p>${has('dispatch')?'':`<button class="btn sm">Add a ${sg('job').toLowerCase()}</button>`}</div>`}</div>`:''}
 ${nodesOf('asset').length?`<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Equipment due or late</h3><span class="sm mut">${nodesOf('asset').length} tracked</span></div>${wk()?nodesOf('asset').slice(0,4).map((n,i)=>`<div class="lr"><span><i class="fa-solid fa-truck" style="color:#AFAFB5"></i> ${n.name}</span><span class="chip ${i===0?'chip-late':'chip-warning'}">${i===0?'3 days late':'Due in '+(i*4)+' days'}</span></div>`).join(''):`<p class="sm mut">Checks on hours, mileage or a 92-day window come from each item's own schedule in Assets. They'll show here when they're due, at the ${sg('site').toLowerCase()} the equipment is at.</p>`}</div>`:''}
 <div class="card"><h3>People</h3>${wk()?`<div style="margin:6px 0"><b style="font-size:18px">5</b> <span style="color:var(--link)">with something outstanding</span></div><div class="lr">D. Price<span class="sm mut">1/5 left</span></div><div class="lr">K. Bennett<span class="sm" style="border:1px solid var(--line);border-radius:3px;padding:0 5px">WHMIS expired</span></div>`:`<p class="sm mut">${sites.reduce((a,n)=>a+(n.users||0),0)} people brought in from your Locations, with their training.</p><button class="btn sec sm" onclick="S.checklist.invite=true;render()">Invite supervisors to the app</button>`}</div></div>`;
}
function place(){
 const n=nodesOf('site').concat(nodesOf('crew')).find(x=>x.id===S.fmSite)||{name:'—',users:0};
 const t=S.labels[n.id]||'site'; const R=ROUTINES(S.client).filter(r=>S.routines.includes(r.id));
 const subs=[['Start of Day','A. Brooks','6:42 am','Completed'],['Start of Day','T. Nguyen','6:51 am','Completed'],['Site walk','E. Chen','10:10 am','Pending signature'],['Start of Day','D. Price','—','Missing']];
 return `<div class="card row" style="padding:14px 20px;margin-bottom:14px"><div class="ico"><i class="fa-solid fa-house"></i></div><div style="flex:1"><h1 style="margin:0">${n.name}</h1><div class="sm mut">${sg(t)} · ${n.users} people${parentOf(n.id)&&parentOf(n.id).id!=='root'?' · in '+parentOf(n.id).name:''} · <a style="color:var(--link)">Edit</a></div></div><button class="btn sec sm">Export</button><button class="btn sm">+ Assign</button></div>
 ${hint('site',`Supervisors at <b>${n.name}</b> see this page on their phone. People here come from Locations, so moving someone in Locations moves them here too.`)}
 <div class="card"><div class="tabs"><button class="on">Today</button><button>People</button><button>Routines</button><button>Calendar</button></div>
 ${wk()?`<table><tr><th>Submission</th><th>By</th><th>Completed</th><th>Status</th></tr>${subs.map(s=>`<tr><td><a>${s[0]}</a></td><td>${s[1]}</td><td>${s[2]}</td><td><span class="chip" style="border-color:${s[3]==='Missing'?'var(--red)':s[3]==='Completed'?'var(--green)':'var(--amber)'}">${s[3]}</span></td></tr>`).join('')}</table>`:
 `<div class="empty"><div class="ico" style="margin:0 auto 8px"><i class="fa-solid fa-clipboard-list"></i></div><h3>Nothing submitted yet today</h3><p class="mut sm">${R.length?`Each morning, <b>${R.map(r=>r.name).join(' and ')}</b> show up here as people complete them, and anything missing is flagged.`:`Add a routine to set what's expected here each day.`}</p>${R.length?`<button class="btn sec" onclick="S.checklist.app=true;render()">See it on a phone</button>`:`<button class="btn" onclick="go('routine')">Add a routine</button>`}</div>`}</div>`;
}
function list(){ const t=S.fmSite; const L=nodesOf(t);
 return `<div class="card row" style="padding:14px 20px;margin-bottom:14px"><div style="flex:1"><h1 style="margin:0">${pl(t)}</h1><div class="sm mut">${L.length} · from Locations</div></div><button class="btn sm">+ Add ${sg(t).toLowerCase()}</button></div>
 <div class="card">${L.length?L.map((n,i)=>`<div class="lr"><a style="color:var(--link)" onclick="fm('place','${n.id}')">${n.name}</a><span class="sm mut">${n.users} people${wk()?` · ${stat(i).exp-stat(i).done} left today`:''}</span></div>`).join(''):`<div class="empty"><h3>No ${pl(t).toLowerCase()} yet</h3><button class="btn">Add one</button></div>`}</div>`; }
function manage(){
 return `<div class="card row" style="padding:14px 20px;margin-bottom:14px"><div style="flex:1"><h1 style="margin:0">Setup and words</h1><div class="sm mut">Change anything you chose in setup.</div></div><button class="btn sec sm" onclick="go('work')">Run setup again</button></div>
 ${hint('manage','Renaming a word here changes it everywhere in Field Management, for everyone in your company.')}
 <div class="grid2"><div class="card"><h3>Your words</h3>${['group','site','job','crew'].filter(t=>t!=='job'||jobsOn()).map(t=>`<div class="lr"><span>${DESC[t]}</span><b>${sg(t)} / ${pl(t)}</b></div>`).join('')}<button class="btn ghost" onclick="go('words')">Change words</button></div>
 <div class="card"><h3>Structure</h3><p class="sm mut">${S.source!=='fresh'?'Linked to your Locations. Changes there show up here.':'Built in Field Management. Not linked to Locations.'}</p><div class="sm">${countLine()}</div><button class="btn ghost" onclick="go('structure')">Change what's included</button></div></div>`; }
function routinesPage(){ const R=ROUTINES(S.client).filter(r=>S.routines.includes(r.id));
 return `<div class="card row" style="padding:14px 20px;margin-bottom:14px"><div style="flex:1"><h1 style="margin:0">Routines</h1><div class="sm mut">What's expected, and when.</div></div><button class="btn sm" onclick="go('routine')">+ New routine</button></div>
 <div class="card">${R.length?`<table><tr><th>Routine</th><th>What</th><th>Schedule</th><th>Counts per</th></tr>${R.map(r=>`<tr><td><a>${r.name}</a></td><td>${r.items.filter((x,j)=>x.req&&!S.reqOff[r.id+j]).length} required · ${r.items.filter((x,j)=>!x.req||S.reqOff[r.id+j]).length} optional</td><td>${r.when}</td><td>${r.per}</td></tr>`).join('')}</table>`:`<div class="empty"><h3>No routines yet</h3><p class="sm mut">We can suggest some from the forms you already use.</p><button class="btn" onclick="go('routine')">See suggestions</button></div>`}</div>`; }
function fmScreen(){ foot(null);
 const body={overview,place,list,manage,routines:routinesPage}[S.fmPage]();
 return sideHtml()+`<div class="fmbody">${body}</div>`; }

/* ============ Checklist launcher ============ */
function checklistItems(){ return [['crews','Check your '+pl('crew').toLowerCase(),'We brought them in from your Locations'],['people','Add people to '+pl('site').toLowerCase()+' with nobody','2 have nobody yet'],['routine','Start a routine','Your team sees what\'s due each day'],['invite','Invite your supervisors','They see their '+pl('crew').toLowerCase()+' on the mobile app'],['app','Try it on your phone','See what a supervisor sees']]; }
function launcherHtml(){
 if(!S.finished||!['fm','home'].includes(S.route)) return '';
 const L=checklistItems(), n=L.filter(([k])=>S.checklist[k]).length;
 if(n===L.length) return '';
 return `${S.launcherOpen?`<div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Finish setting up Field Management</h3><a class="sm mut" onclick="S.launcherOpen=false;render()">✕</a></div>
 <div class="bar g" style="margin:8px 0 6px"><i style="width:${n/L.length*100}%"></i></div>
 ${L.map(([k,t,s])=>`<div class="check"><span class="tick ${S.checklist[k]?'y':''}">${S.checklist[k]?'✓':''}</span><div style="flex:1"><div style="${S.checklist[k]?'text-decoration:line-through;color:var(--mut)':''}">${t}</div><div class="sm mut">${s}</div></div>${S.checklist[k]?'':`<button class="btn ghost" onclick="S.checklist['${k}']=true;${k==='routine'?"go('routine')":'render()'}">Go</button>`}</div>`).join('')}
 <div class="sm mut" style="margin-top:6px">Ticks itself when it's done. <a style="color:var(--blue)">Hide for good</a></div></div>`:''}
 <button class="pill" onclick="S.launcherOpen=!S.launcherOpen;render()"><span class="ring" style="--p:${n/L.length*100}"></span>Finish setting up · ${n} of ${L.length}</button>`;
}

/* ============ Render ============ */
const PEOPLE={
 crew:{name:'Dana',role:'Safety coordinator',av:'D',col:'#2e7d32',bis:'Uses BIS daily for training; has never set up forms for crews.',need:'Needs to know every crew did its hazard assessment before work starts, without phoning foremen.',worry:'Foremen won\'t add another app. Crews move every week, so anything she sets up goes stale.',based:''},
 wo:{name:'Sam',role:'HSE lead',av:'S',col:'#1565c0',bis:'Comfortable in BIS. IT owns the SAP side, and Sam can\'t change it.',need:'Wants each work order to carry its safety paperwork, matched to the order number.',worry:'Double entry. If it doesn\'t talk to SAP, techs will skip it.',based:''},
 asset:{name:'Jordan',role:'Compliance manager',av:'J',col:'#6a1b9a',bis:'Light BIS user. Tracks due dates in a spreadsheet today.',need:'Wants to see which locomotives and stations are overdue, across every yard, in one place.',worry:'Due dates by hours of use, not just the calendar.',based:''},
 place:{name:'Alex',role:'Regional safety lead',av:'A',col:'#00838f',bis:'BIS power user. Locations already sync from HR twice a day.',need:'Wants every branch\'s monthly inspection done, and a branch-by-branch score for leadership.',worry:'Anything that breaks the HR sync, or moves people by hand.',based:''},
 gate:{name:'Priya',role:'Site HSE superintendent',av:'P',col:'#c62828',bis:'Uses BIS for training records only. Daily forms live in another system.',need:'Needs to know who is allowed on site today: tickets, orientation and their company\'s approval.',worry:'Contractors with expired tickets getting through the gate.',based:''}};
function personHtml(k,big){ const p=PEOPLE[k]; return `<div class="row" style="gap:10px;align-items:flex-start;${big?'':'background:#fafafb;border:1px solid var(--line);border-radius:6px;padding:10px'}"><span style="width:38px;height:38px;border-radius:50%;background:${p.col};color:#fff;display:grid;place-items:center;font-weight:700;flex:none">${p.av}</span><div class="sm" style="flex:1"><b style="font-size:14px">${p.name}</b> · ${p.role}<div class="mut">${p.bis}</div><div style="margin-top:4px"><b>Needs:</b> ${p.need}</div><div><b>Worried about:</b> ${p.worry}</div></div></div>`; }
const TYPEICON={A:'<i class="fa-solid fa-road-barrier"></i>',B:'<i class="fa-solid fa-receipt"></i>',C:'<i class="fa-solid fa-gear"></i>',D:'<i class="fa-solid fa-building"></i>',E:'<i class="fa-solid fa-id-card"></i>'};
function pick(){ foot(null);
 return `<h1>Pick a company to test as</h1><p class="mut" style="margin-top:0">One made-up company per way of working. Each is based on real clients.</p>
 <div style="display:grid;gap:10px">${Object.entries(CLIENTS).map(([k,c])=>{ const p=PEOPLE[k]; return `<div class="card" style="cursor:pointer;display:grid;grid-template-columns:56px 1.1fr 1.4fr 1fr auto;gap:16px;align-items:center;padding:14px 16px" onclick="document.getElementById('client').value='${k}';reset('${k}')">
  <div style="width:56px;height:56px;border-radius:12px;background:var(--blue-l);display:grid;place-items:center;font-size:26px">${TYPEICON[c.type]}</div>
  <div><div class="sm mut">Type ${c.type}</div><b style="font-size:16px">${c.typeName}</b><div class="sm">${c.label}</div></div>
  <div class="sm"><b>Their work hangs on:</b> ${c.hangs}<div class="mut" style="margin-top:2px">${c.line}</div></div>
  <div class="row sm" style="gap:8px;flex-wrap:nowrap"><span style="width:30px;height:30px;border-radius:50%;background:${p.col};color:#fff;display:grid;place-items:center;font-weight:700;flex:none">${p.av}</span><div><b>${p.name}</b><div class="mut">${p.role}</div></div></div>
  <button class="btn sm">Test</button>
  ${S.noteOpen?`<div class="sm" style="grid-column:1/-1;background:#fffbe6;border:1px solid #e8d77a;border-radius:4px;padding:4px 8px">Company based on: ${c.based} · Person based on: ${p.based}</div>`:''}</div>`; }).join('')}</div>
 <p class="sm mut" style="margin-top:12px">Open <b>ⓘ Design note</b> to see which real clients each one is based on.</p>`; }
const SCREENS={pick,home,intro,work,structure,words,routine,fm:fmScreen};
function render(){ if(C) TREE=srcTree(S.source);
 $('#nav').innerHTML=navHtml();
 const P=PEOPLE[S.client]; $('#who').innerHTML=S.route==='pick'?'':`<span class="sm mut" title="${P.need}" style="display:flex;gap:6px;align-items:center"><span style="width:24px;height:24px;border-radius:50%;background:${P.col};color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700">${P.av}</span>${P.name} · ${C.label}</span>`;
 $('#app').className=S.route==='home'?'wide':S.route==='fm'?'fm':'';
 $('#app').innerHTML=SCREENS[S.route]();
 $('#drawer').innerHTML=S.route==='work'?drawerHtml():'';
 const lh=launcherHtml(); $('#launcher').innerHTML=lh; $('#launcher').classList.toggle('hide',!lh);
 const nt=NOTES[S.route==='fm'?(S.fmPage==='place'?'site':S.fmPage==='overview'?'overview':'manage'):S.route]; const el=$('#note');
 if(S.noteOpen&&nt){ el.style.display='block'; el.innerHTML=`<div class="row" style="justify-content:space-between"><b>Design note · ${nt[0]}</b><a onclick="S.noteOpen=false;render()">✕</a></div>${nt[1]}`; } else el.style.display='none';
 const f=document.querySelector('[autofocus]'); if(f) f.focus();
}
$('#client').innerHTML=Object.entries(CLIENTS).map(([k,c])=>`<option value="${k}">${c.type} · ${c.label}</option>`).join('');
window.addEventListener('resize',placeNavTip);
document.addEventListener('mousedown',e=>{ if(S.comboOpen&&!e.target.closest('#app [style*="position:relative"]')){ S.comboOpen=false; S.comboQ=''; render(); } });
reset("crew");S.route="pick";render();
</script>
</body>
</html>
